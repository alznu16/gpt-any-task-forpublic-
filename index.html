<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Breach - Clean Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#fff;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#08111b}
#hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:rgba(0,0,0,.55);padding:10px 13px;border:1px solid rgba(255,255,255,.15);border-radius:10px;text-shadow:0 2px 5px #000}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;font-weight:bold;pointer-events:none}
#message{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;text-shadow:0 3px 12px #000}
#title{font-size:32px;font-weight:900}
#subtitle{margin-top:7px}
#help{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);padding:8px 12px;background:rgba(0,0,0,.55);border-radius:8px;font-size:13px;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="panel"><b>NEON BREACH</b><br>Score: <span id="score">0</span> · Wave: <span id="wave">1</span><br>HP: <span id="hp">100</span></div>
  <div class="panel">Enemies: <span id="enemies">0</span></div>
</div>
<div id="crosshair">+</div>
<div id="message"><div id="title">CLICK TO PLAY</div><div id="subtitle">WASD · Mouse · Left Click</div></div>
<div id="help">Click = mouse lock · WASD = move · Mouse = look · Left Click = fire · Esc = unlock · R = restart</div>

<script>
(function(){
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const waveEl=document.getElementById("wave");
const hpEl=document.getElementById("hp");
const enemiesEl=document.getElementById("enemies");
const titleEl=document.getElementById("title");
const subtitleEl=document.getElementById("subtitle");

let W=0,H=0;
function resize(){
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=W;
  canvas.height=H;
}
window.addEventListener("resize",resize);
resize();

const MAP=[
"################",
"#..............#",
"#..##.....##...#",
"#..............#",
"#....##........#",
"#........##....#",
"#..##..........#",
"#..............#",
"#.....####.....#",
"#..............#",
"#....##........#",
"#..............#",
"#...##.....##..#",
"#..............#",
"#..............#",
"################"
];
const MW=MAP[0].length,MH=MAP.length;

function wall(x,y){
  const mx=Math.floor(x),my=Math.floor(y);
  return mx<0||my<0||mx>=MW||my>=MH||MAP[my][mx]==="#";
}
function blocked(x,y,r){
  const minX=Math.floor(x-r),maxX=Math.floor(x+r);
  const minY=Math.floor(y-r),maxY=Math.floor(y+r);
  for(let y0=minY;y0<=maxY;y0++){
    for(let x0=minX;x0<=maxX;x0++){
      if(x0<0||y0<0||x0>=MW||y0>=MH||MAP[y0][x0]==="#"){
        const cx=Math.max(x0,Math.min(x,x0+1));
        const cy=Math.max(y0,Math.min(y,y0+1));
        const dx=x-cx,dy=y-cy;
        if(dx*dx+dy*dy<r*r)return true;
      }
    }
  }
  return false;
}
function move(obj,dx,dy,r){
  const n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/.06));
  const sx=dx/n,sy=dy/n;
  for(let i=0;i<n;i++){
    if(!blocked(obj.x+sx,obj.y,r))obj.x+=sx;
    if(!blocked(obj.x,obj.y+sy,r))obj.y+=sy;
  }
}
function clearLine(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1);
  const n=Math.ceil(d*12);
  for(let i=1;i<n;i++){
    const t=i/n;
    if(wall(x1+(x2-x1)*t,y1+(y2-y1)*t))return false;
  }
  return true;
}

const player={x:2.5,y:2.5,r:.22,speed:3,hp:100};
const camera={yaw:0,pitch:0,distance:3.2};
let enemies=[];
let bullets=[];
let particles=[];
let score=0;
let wave=1;
let spawnTimer=0;
let fireTimer=0;
let gameOver=false;
let mouseLocked=false;
let mouseDown=false;
const keys=Object.create(null);

function reset(){
  player.x=2.5;player.y=2.5;player.hp=100;
  camera.yaw=0;camera.pitch=0;
  enemies=[];bullets=[];particles=[];
  score=0;wave=1;spawnTimer=.5;fireTimer=0;gameOver=false;
  titleEl.textContent="CLICK TO PLAY";
  subtitleEl.textContent="WASD · Mouse · Left Click";
  updateHud();
}

window.addEventListener("keydown",function(e){
  keys[e.key.toLowerCase()]=true;
  if(["w","a","s","d"," "].includes(e.key.toLowerCase()))e.preventDefault();
  if(e.key.toLowerCase()==="r"&&gameOver)reset();
});
window.addEventListener("keyup",function(e){
  delete keys[e.key.toLowerCase()];
});

canvas.addEventListener("mousedown",function(e){
  if(e.button!==0||gameOver)return;
  if(!mouseLocked){
    canvas.requestPointerLock();
    return;
  }
  mouseDown=true;
  shoot();
});
window.addEventListener("mouseup",function(e){
  if(e.button===0)mouseDown=false;
});
document.addEventListener("pointerlockchange",function(){
  mouseLocked=document.pointerLockElement===canvas;
  if(mouseLocked&&!gameOver){
    titleEl.textContent="";
    subtitleEl.textContent="";
    shoot();
  }else if(!gameOver){
    titleEl.textContent="PAUSED";
    subtitleEl.textContent="Click to resume";
  }
});
document.addEventListener("mousemove",function(e){
  if(!mouseLocked)return;
  camera.yaw+=e.movementX*.0025;
  camera.pitch-=e.movementY*.002;
  camera.pitch=Math.max(-.55,Math.min(.55,camera.pitch));
});
window.addEventListener("blur",function(){
  mouseDown=false;
  if(document.pointerLockElement===canvas)document.exitPointerLock();
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden){
    mouseDown=false;
    if(document.pointerLockElement===canvas)document.exitPointerLock();
  }
});

function spawnEnemy(){
  for(let i=0;i<100;i++){
    const x=1.5+Math.random()*(MW-3);
    const y=1.5+Math.random()*(MH-3);
    if(!blocked(x,y,.27)&&Math.hypot(x-player.x,y-player.y)>5){
      enemies.push({x:x,y:y,r:.27,hp:1+Math.floor((wave-1)/3),speed:.7+Math.random()*.25});
      return;
    }
  }
}

function shoot(){
  if(fireTimer>0||gameOver||!mouseLocked)return;
  fireTimer=.15;
  const dx=Math.cos(camera.yaw),dy=Math.sin(camera.yaw);
  bullets.push({x:player.x+dx*.45,y:player.y+dy*.45,dx:dx,dy:dy,life:1.2});
  particles.push({x:player.x+dx*.45,y:player.y+dy*.45,life:.12});
}

function updatePlayer(dt){
  const fx=Math.cos(camera.yaw),fy=Math.sin(camera.yaw);
  const rx=Math.cos(camera.yaw+Math.PI/2),ry=Math.sin(camera.yaw+Math.PI/2);
  let x=0,y=0;
  if(keys.w){x+=fx;y+=fy}
  if(keys.s){x-=fx;y-=fy}
  if(keys.d){x+=rx;y+=ry}
  if(keys.a){x-=rx;y-=ry}
  if(x||y){
    const l=Math.hypot(x,y);
    move(player,x/l*player.speed*dt,y/l*player.speed*dt,player.r);
  }
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    const oldX=b.x,oldY=b.y;
    b.x+=b.dx*14*dt;
    b.y+=b.dy*14*dt;
    b.life-=dt;
    let remove=b.life<=0||wall(b.x,b.y);
    if(!remove){
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+.13){
          e.hp--;
          remove=true;
          if(e.hp<=0){
            score+=10*wave;
            enemies.splice(j,1);
          }
          break;
        }
      }
    }
    if(remove)bullets.splice(i,1);
    if(!remove){
      particles.push({x:(oldX+b.x)/2,y:(oldY+b.y)/2,life:.04});
    }
  }
}

function updateEnemies(dt){
  for(const e of enemies){
    const dx=player.x-e.x,dy=player.y-e.y;
    const d=Math.hypot(dx,dy)||1;
    if(d>1){
      if(clearLine(e.x,e.y,player.x,player.y)){
        move(e,dx/d*e.speed*dt,dy/d*e.speed*dt,e.r);
      }else{
        // Simple wall-follow fallback: try four directions and choose one
        // that gets closer without requiring a fragile pathfinding system.
        const dirs=[
          [dx/d,dy/d],
          [-dy/d,dx/d],
          [dy/d,-dx/d],
          [-dx/d,-dy/d]
        ];
        let best=null,bestD=d;
        for(const v of dirs){
          const nx=e.x+v[0]*e.speed*dt;
          const ny=e.y+v[1]*e.speed*dt;
          if(!blocked(nx,ny,e.r)){
            const nd=Math.hypot(player.x-nx,player.y-ny);
            if(nd<bestD){bestD=nd;best=v}
          }
        }
        if(best)move(e,best[0]*e.speed*dt,best[1]*e.speed*dt,e.r);
      }
    }else{
      player.hp=Math.max(0,player.hp-18*dt);
    }
  }
}

function update(dt){
  if(gameOver||!mouseLocked)return;

  updatePlayer(dt);
  fireTimer=Math.max(0,fireTimer-dt);
  if(mouseDown)shoot();
  updateBullets(dt);
  updateEnemies(dt);

  spawnTimer-=dt;
  const target=Math.min(12,3+wave*2);
  if(spawnTimer<=0&&enemies.length<target){
    spawnEnemy();
    spawnTimer=.8;
  }
  if(enemies.length===0&&spawnTimer<0&&score>0){
    wave++;
    spawnTimer=1.5;
  }

  for(let i=particles.length-1;i>=0;i--){
    particles[i].life-=dt;
    if(particles[i].life<=0)particles.splice(i,1);
  }

  if(player.hp<=0){
    gameOver=true;
    mouseDown=false;
    titleEl.textContent="SYSTEM DOWN";
    subtitleEl.textContent="Press R to restart";
    if(document.pointerLockElement===canvas)document.exitPointerLock();
  }
  updateHud();
}

const FOV=Math.PI/3;

function getCameraPosition(){
  // Real third-person camera: behind and slightly to the left of the player.
  const backX=-Math.cos(camera.yaw)*camera.distance;
  const backY=-Math.sin(camera.yaw)*camera.distance;
  const shoulder=-.55;
  const sideX=Math.cos(camera.yaw+Math.PI/2)*shoulder;
  const sideY=Math.sin(camera.yaw+Math.PI/2)*shoulder;
  return {
    x:player.x+backX+sideX,
    y:player.y+backY+sideY,
    z:1.72
  };
}

function project(x,y,z){
  const cam=getCameraPosition();
  const dx=x-cam.x;
  const dy=y-cam.y;

  const forward=Math.cos(camera.yaw)*dx+Math.sin(camera.yaw)*dy;
  const side=-Math.sin(camera.yaw)*dx+Math.cos(camera.yaw)*dy;
  if(forward<=.08)return null;

  const focal=(W/2)/Math.tan(FOV/2);

  // Pitch rotates the view around the camera instead of merely moving the horizon.
  const vertical=(z-cam.z);
  const pitchShift=vertical*Math.sin(camera.pitch);
  const depthAdjusted=forward*Math.cos(camera.pitch)+vertical*Math.sin(camera.pitch);
  if(depthAdjusted<=.05)return null;

  const sx=W/2+(side/depthAdjusted)*focal;
  const horizon=H/2;
  const sy=horizon-(
    (vertical*Math.cos(camera.pitch)-forward*Math.sin(camera.pitch))
    /depthAdjusted
  )*focal;

  return {forward:depthAdjusted,side,sx,sy,focal};
}

function drawBackground(){
  const sky=ctx.createLinearGradient(0,0,0,H*.55);
  sky.addColorStop(0,"#050a13");
  sky.addColorStop(1,"#183048");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  const focal=(W/2)/Math.tan(FOV/2);
  const horizon=Math.max(-H,Math.min(H*2,H/2+Math.tan(camera.pitch)*focal));
  const floor=ctx.createLinearGradient(0,horizon,0,H);
  floor.addColorStop(0,"#233a4b");
  floor.addColorStop(1,"#0a1119");
  ctx.fillStyle=floor;
  ctx.fillRect(0,horizon,W,H-horizon);

  ctx.strokeStyle="rgba(120,210,240,.13)";
  for(let i=1;i<12;i++){
    const t=i/12;
    const y=horizon+(H-horizon)*t*t;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
}

function drawWalls(){
  const cam=getCameraPosition();
  for(let x=0;x<W;x+=2){
    const angle=camera.yaw+(x/W-.5)*FOV;
    const dx=Math.cos(angle),dy=Math.sin(angle);
    let dist=0,hit=false;
    for(let s=0;s<55;s++){
      dist+=.12;
      if(wall(cam.x+dx*dist,cam.y+dy*dist)){
        hit=true;
        break;
      }
    }
    if(!hit)continue;

    const corrected=Math.max(.12,dist*Math.cos((x/W-.5)*FOV));
    const wx=cam.x+dx*dist;
    const wy=cam.y+dy*dist;
    const bottom=project(wx,wy,0);
    const topPoint=project(wx,wy,2.6);
    if(!bottom||!topPoint)continue;

    const top=Math.min(topPoint.sy,bottom.sy);
    const bottomY=Math.max(topPoint.sy,bottom.sy);
    const height=bottomY-top;
    const light=Math.max(.15,1-corrected/18);
    ctx.fillStyle="rgb("+Math.floor(24+34*light)+","+Math.floor(42+52*light)+","+Math.floor(60+68*light)+")";
    ctx.fillRect(x,top,2.2,height);
  }
}

function drawBoxWorld(x,y,z,w,d,h,rot,color){
  const points=[];
  for(const p of [[-w/2,-d/2,0],[w/2,-d/2,0],[w/2,d/2,0],[-w/2,d/2,0],[-w/2,-d/2,h],[w/2,-d/2,h],[w/2,d/2,h],[-w/2,d/2,h]]){
    const c=Math.cos(rot),s=Math.sin(rot);
    const px=x+p[0]*c-p[1]*s;
    const py=y+p[0]*s+p[1]*c;
    points.push(project(px,py,z+p[2]));
  }
  if(points.some(p=>!p))return;
  const faces=[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7]];
  const shades=[.75,1,.6,.85,1.1];
  const order=faces.map((f,i)=>({f,i,d:f.reduce((a,n)=>a+points[n].forward,0)/4})).sort((a,b)=>b.d-a.d);
  for(const o of order){
    const pts=o.f.map(n=>points[n]);
    ctx.fillStyle="rgb("+Math.floor(color[0]*shades[o.i])+","+Math.floor(color[1]*shades[o.i])+","+Math.floor(color[2]*shades[o.i])+")";
    ctx.beginPath();
    ctx.moveTo(pts[0].sx,pts[0].sy);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].sx,pts[i].sy);
    ctx.closePath();ctx.fill();
  }
}

function drawEnemy(e){
  const p=project(e.x,e.y,0);
  if(!p)return;
  const rot=Math.atan2(player.y-e.y,player.x-e.x);
  const size=Math.max(5,25/p.forward);
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();ctx.ellipse(p.sx,p.sy+2,size,size*.35,0,0,Math.PI*2);ctx.fill();

  drawBoxWorld(e.x,e.y,0,.5,.38,.70,rot,[225,45,85]);
  drawBoxWorld(e.x,e.y,.70,.32,.32,.36,rot,[255,85,125]);
  drawBoxWorld(e.x-.22*Math.sin(rot),e.y+.22*Math.cos(rot),.65,.16,.16,.5,rot,[175,35,70]);
  drawBoxWorld(e.x+.22*Math.sin(rot),e.y-.22*Math.cos(rot),.65,.16,.16,.5,rot,[175,35,70]);
}

function drawPlayer(){
  const rot=camera.yaw;
  const p=project(player.x,player.y,0);
  if(!p)return;
  const size=Math.max(7,35/p.forward);
  ctx.fillStyle="rgba(0,0,0,.38)";
  ctx.beginPath();ctx.ellipse(p.sx,p.sy+3,size*1.2,size*.4,0,0,Math.PI*2);ctx.fill();

  drawBoxWorld(player.x,player.y,.05,.55,.4,.72,rot,[45,160,190]);
  drawBoxWorld(player.x,player.y,.77,.7,.44,.72,rot,[55,190,215]);
  drawBoxWorld(player.x,player.y,1.48,.38,.38,.38,rot,[105,225,240]);
  drawBoxWorld(player.x-.4*Math.sin(rot),player.y+.4*Math.cos(rot),.82,.18,.18,.6,rot-.1,[35,125,155]);
  drawBoxWorld(player.x+.4*Math.sin(rot),player.y-.4*Math.cos(rot),.82,.18,.18,.6,rot+.1,[35,125,155]);

  // Right-hand weapon.
  const gx=player.x+Math.cos(rot)*.45-Math.sin(rot)*.42;
  const gy=player.y+Math.sin(rot)*.45+Math.cos(rot)*.42;
  drawBoxWorld(gx,gy,.95,.16,.16,.72,rot,[25,40,58]);

  const muzzle=project(gx+Math.cos(rot)*.4,gy+Math.sin(rot)*.4,1.0);
  if(muzzle){
    ctx.fillStyle="#9dfaff";
    ctx.beginPath();ctx.arc(muzzle.sx,muzzle.sy,Math.max(2,5/muzzle.forward),0,Math.PI*2);ctx.fill();
  }
}

function drawBullets(){
  for(const b of bullets){
    const p=project(b.x,b.y,1.05);
    if(!p)continue;
    const r=Math.max(2,7/p.forward);
    ctx.fillStyle="#a9ffff";
    ctx.beginPath();ctx.arc(p.sx,p.sy,r,0,Math.PI*2);ctx.fill();
  }
}

function render(){
  drawBackground();
  drawWalls();
  for(const e of enemies)drawEnemy(e);
  drawBullets();
  drawPlayer();
}

function updateHud(){
  scoreEl.textContent=score;
  waveEl.textContent=wave;
  hpEl.textContent=Math.ceil(player.hp);
  enemiesEl.textContent=enemies.length;
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.04,(now-last)/1000);
  last=now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
